<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRÓM · Admin POS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">

<script>

  // ======================================================
  // 🔧 CONFIGURACIÓN FIREBASE — reemplaza con tus datos
  // ======================================================
  const firebaseConfig = {
    apiKey: "TU_API_KEY",
    authDomain: "TU_PROJECT.firebaseapp.com",
    projectId: "TU_PROJECT_ID",
    storageBucket: "TU_PROJECT.appspot.com",
    messagingSenderId: "TU_SENDER_ID",
    appId: "TU_APP_ID"
  };

  let db;
  let useFirebase = false;

  try {
    const app = initializeApp(firebaseConfig);
    db = getFirestore(app);
    useFirebase = true;
    console.log('✅ Firebase conectado');
  } catch(e) {
    console.warn('⚠️ Firebase no configurado — modo local activo');
  }

  // Estado local compartido con la pagina publica.
  let state = {
    barberos: [
      { id: 'b1', nombre: 'Carlos Mendoza', especialidad: 'Fades & Diseños', tel: '3001234567', foto: null, activo: true },
      { id: 'b2', nombre: 'Andrés López', especialidad: 'Cortes Clásicos', tel: '3007654321', foto: null, activo: true },
      { id: 'b3', nombre: 'Miguel Torres', especialidad: 'Barba & Estilo', tel: '3009876543', foto: null, activo: true },
    ],
    servicios: [
      { id: 's1', nombre: 'Corte Clásico', precio: 25000, duracion: 30 },
      { id: 's2', nombre: 'Fade + Diseño', precio: 35000, duracion: 45 },
      { id: 's3', nombre: 'Barba Completa', precio: 20000, duracion: 25 },
      { id: 's4', nombre: 'Corte + Barba', precio: 45000, duracion: 60 },
      { id: 's5', nombre: 'Cejas', precio: 10000, duracion: 15 },
      { id: 's6', nombre: 'Mascarilla Facial', precio: 30000, duracion: 20 },
    ],
    cortes: [],
    reservas: [],
    clientes: [],
    activeTab: 'pos',
    barberoActivo: null, // barbero seleccionado en modo POS rápido
  };

  const defaultServicesData = [
    { id: 1, name: 'Corte Clasico', price: 25000, duration: '30 min', desc: 'Corte tradicional con acabado perfecto.', img: 'https://images.unsplash.com/photo-1599351431202-1e0f0137899a?w=600&q=80', icon: '01' },
    { id: 2, name: 'Fade + Diseno', price: 35000, duration: '45 min', desc: 'Degradado moderno con disenos personalizados.', img: 'https://images.unsplash.com/photo-1622286342621-4bd786c2447c?w=600&q=80', icon: '02' },
    { id: 3, name: 'Barba Completa', price: 20000, duration: '25 min', desc: 'Perfilado y arreglo de barba.', img: 'https://images.unsplash.com/photo-1595152452543-e5fc28ebc2b8?w=600&q=80', icon: '03' },
    { id: 4, name: 'Corte + Barba', price: 45000, duration: '60 min', desc: 'Combo completo de corte y barba.', img: 'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=600&q=80', icon: '04' },
    { id: 5, name: 'Cejas', price: 10000, duration: '15 min', desc: 'Diseno y depilacion de cejas.', img: 'https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=600&q=80', icon: '05' },
    { id: 6, name: 'Mascarilla Facial', price: 30000, duration: '20 min', desc: 'Tratamiento facial premium.', img: 'https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=600&q=80', icon: '06' }
  ];

  const defaultBarbersData = [
    { id: 1, name: 'Carlos Mendoza', specialty: 'Fades & Disenos', img: 'https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=400&q=80', wa: '573146966976' },
    { id: 2, name: 'Andres Lopez', specialty: 'Cortes Clasicos', img: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=400&q=80', wa: '573146966976' },
    { id: 3, name: 'Miguel Torres', specialty: 'Barba & Estilo', img: 'https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=400&q=80', wa: '573146966976' },
    { id: 4, name: 'Juan Perez', specialty: 'Disenos & Arte', img: 'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=400&q=80', wa: '573146966976' }
  ];

  let servicesData = [];
  let barbersData = [];
  let bookingsData = [];
  let salesData = [];
  const defaultGalleryData = [
    'https://images.unsplash.com/photo-1503951914875-452162b0f3f1?w=800&q=80',
    'https://images.unsplash.com/photo-1622286342621-4bd786c2447c?w=800&q=80',
    'https://images.unsplash.com/photo-1621605815971-fbc98d665033?w=800&q=80',
    'https://images.unsplash.com/photo-1595152452543-e5fc28ebc2b8?w=800&q=80',
    'https://images.unsplash.com/photo-1585747860715-2ba37e788b70?w=800&q=80',
    'https://images.unsplash.com/photo-1599351431202-1e0f0137899a?w=800&q=80'
  ];
  let galleryData = [];

  function readStore(key, fallback) {
    try {
      const value = JSON.parse(localStorage.getItem(key) || 'null');
      return value ?? structuredClone(fallback);
    } catch(e) {
      return structuredClone(fallback);
    }
  }

  function minutesFromDuration(duration) {
    return parseInt(String(duration || '').match(/\d+/)?.[0], 10) || 30;
  }

  function normalizeDateTime(item) {
    if(item.createdAt) return item.createdAt;
    if(item.ts) return item.ts;
    if(item.date) return new Date(`${item.date}T12:00:00`).toISOString();
    return new Date().toISOString();
  }

  function buildClientes(cortes, reservas, barberos) {
    const map = new Map();
    reservas.forEach(r => {
      if(!r.clienteNombre) return;
      const key = r.clienteNombre.toLowerCase();
      const current = map.get(key);
      map.set(key, {
        id: key,
        nombre: r.clienteNombre,
        tel: r.clienteTel || current?.tel || '',
        visitas: (current?.visitas || 0) + 1,
        ultimoServicio: r.servicio || current?.ultimoServicio || '',
        barberoFav: barberos.find(b => b.nombre === r.barbero)?.id || current?.barberoFav || '',
        ts: r.fecha || current?.ts || ''
      });
    });
    cortes.forEach(c => {
      if(!c.clienteNombre) return;
      const key = c.clienteNombre.toLowerCase();
      const current = map.get(key);
      map.set(key, {
        id: key,
        nombre: c.clienteNombre,
        tel: c.clienteTel || current?.tel || '',
        visitas: (current?.visitas || 0) + 1,
        ultimoServicio: c.servicio || current?.ultimoServicio || '',
        barberoFav: c.barbeId || current?.barberoFav || '',
        ts: c.ts || current?.ts || ''
      });
    });
    return Array.from(map.values());
  }

  function syncStateFromStorage(keepUi = true) {
    const activeTab = keepUi ? state.activeTab : 'pos';
    const barberoActivo = keepUi ? state.barberoActivo : null;
    servicesData = readStore('krom_services', defaultServicesData);
    barbersData = readStore('krom_barbers', defaultBarbersData);
    bookingsData = readStore('krom_bookings', []);
    salesData = readStore('krom_sales', []);
    galleryData = readStore('krom_gallery', defaultGalleryData);

    state.barberos = barbersData.map(b => ({ id: String(b.id), nombre: b.name, especialidad: b.specialty || 'Barbero', tel: b.wa || '', foto: b.img || null, activo: true }));
    state.servicios = servicesData.map(s => ({ id: String(s.id), nombre: s.name, precio: Number(s.price) || 0, duracion: minutesFromDuration(s.duration) }));
    state.cortes = salesData.map((s, index) => {
      const barber = state.barberos.find(b => b.nombre === s.barber);
      return { id: String(s.id || `sale-${index}`), barbeId: barber?.id || '', servicio: s.service || 'Servicio', precio: Number(s.amount ?? s.precio) || 0, pago: s.pago || 'Efectivo', clienteNombre: s.client || '', clienteTel: s.phone || '', ts: normalizeDateTime(s) };
    }).reverse();
    state.reservas = bookingsData.map((b, index) => ({ id: String(b.id || `booking-${index}`), clienteNombre: b.client || '', clienteTel: b.phone || '', servicio: b.service || '', barbero: b.barber || '', fecha: b.date || '', hora: b.time || '' }));
    state.clientes = buildClientes(state.cortes, state.reservas, state.barberos);
    state.activeTab = activeTab;
    state.barberoActivo = state.barberos.some(b => b.id === barberoActivo) ? barberoActivo : null;
  }

  function persistServices() {
    servicesData = state.servicios.map(s => {
      const existing = servicesData.find(item => String(item.id) === String(s.id)) || {};
      return { ...existing, id: Number(s.id) || s.id, name: s.nombre, price: Number(s.precio) || 0, duration: `${s.duracion || 30} min` };
    });
    localStorage.setItem('krom_services', JSON.stringify(servicesData));
  }

  function persistBarbers() {
    barbersData = state.barberos.map(b => {
      const existing = barbersData.find(item => String(item.id) === String(b.id)) || {};
      return { ...existing, id: Number(b.id) || b.id, name: b.nombre, specialty: b.especialidad, wa: b.tel || existing.wa || '573000000000', img: b.foto || '' };
    });
    localStorage.setItem('krom_barbers', JSON.stringify(barbersData));
  }

  function persistGallery() {
    localStorage.setItem('krom_gallery', JSON.stringify(galleryData));
  }

  syncStateFromStorage(false);

  // ==================== HELPERS ====================
  function fmtCOP(n) {
    return '$' + Number(n).toLocaleString('es-CO');
  }
  function fmtHora(d) {
    return new Date(d).toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
  }
  function fmtFecha(d) {
    return new Date(d).toLocaleDateString('es-CO', { day: '2-digit', month: 'short' });
  }
  function todayStart() {
    const d = new Date(); d.setHours(0,0,0,0); return d;
  }
  function getId() { return '_' + Math.random().toString(36).substr(2,9); }
  function getInitials(name) {
    return String(name || 'KR').split(' ').filter(Boolean).slice(0, 2).map(part => part[0]).join('').toUpperCase();
  }
  function hasImage(src) {
    return !!src && String(src).trim() && String(src).trim() !== '#';
  }
  function readImageFile(file, callback) {
    if(!file) return;
    const reader = new FileReader();
    reader.onload = event => callback(event.target.result);
    reader.readAsDataURL(file);
  }

  // ==================== PERSISTENCIA ====================
  async function saveCorte(corte) {
    const barber = state.barberos.find(b => b.id === corte.barbeId);
    salesData.push({
      id: corte.id,
      date: new Date(corte.ts).toISOString().split('T')[0],
      service: corte.servicio,
      barber: barber?.nombre || '',
      amount: Number(corte.precio) || 0,
      pago: corte.pago,
      client: corte.clienteNombre || '',
      phone: corte.clienteTel || '',
      createdAt: corte.ts
    });
    localStorage.setItem('krom_sales', JSON.stringify(salesData));
    state.cortes.unshift(corte);
    trackCliente(corte);
    renderAll();
  }

  function trackCliente(corte) {
    if(!corte.clienteNombre) return;
    let c = state.clientes.find(x => x.nombre.toLowerCase() === corte.clienteNombre.toLowerCase());
    if(!c) {
      c = { id: getId(), nombre: corte.clienteNombre, tel: corte.clienteTel || '', visitas: 0, ultimoServicio: '', barberoFav: corte.barbeId, ts: corte.ts };
      state.clientes.push(c);
    }
    c.visitas++;
    c.ultimoServicio = corte.servicio;
    c.barberoFav = corte.barbeId;
    c.ts = corte.ts;
  }

  async function loadFromFirebase() {
    syncStateFromStorage();
    renderAll();
  }

  // ==================== RENDER ENGINE ====================
  function renderAll() {
    updateStats();
    renderContent();
  }

  function updateStats() {
    const hoy = state.cortes.filter(c => new Date(c.ts) >= todayStart());
    const ingHoy = hoy.reduce((s,c) => s + Number(c.precio), 0);
    const ingTotal = state.cortes.reduce((s,c) => s + Number(c.precio), 0);

    document.getElementById('stat-cortes-hoy').textContent = hoy.length;
    document.getElementById('stat-ing-hoy').textContent = fmtCOP(ingHoy);
    document.getElementById('stat-ing-total').textContent = fmtCOP(ingTotal);
    document.getElementById('stat-total-cortes').textContent = state.cortes.length;
  }

  function renderContent() {
    const tab = state.activeTab;
    const el = document.getElementById('main-content');

    if(tab === 'pos') el.innerHTML = renderPOS();
    else if(tab === 'ventas') el.innerHTML = renderVentas();
    else if(tab === 'clientes') el.innerHTML = renderClientes();
    else if(tab === 'servicios') el.innerHTML = renderServicios();
    else if(tab === 'barberos') el.innerHTML = renderBarberos();
    else if(tab === 'galeria') el.innerHTML = renderGaleria();

    attachHandlers();
  }

  // ==================== POS RÁPIDO ====================
  function renderPOS() {
    const barberoSel = state.barberoActivo;
    return `
    <div class="pos-layout">
      <!-- Panel izquierdo: Selección de barbero -->
      <div class="pos-left">
        <h2 class="section-title">¿Quién registra?</h2>
        <div class="barber-grid">
          ${state.barberos.map(b => `
            <button class="barber-card ${barberoSel === b.id ? 'active' : ''}" data-action="sel-barbero" data-id="${b.id}">
              <div class="barber-avatar">${b.nombre.split(' ').map(x=>x[0]).join('')}</div>
              <span class="barber-name">${b.nombre}</span>
              <span class="barber-esp">${b.especialidad}</span>
            </button>
          `).join('')}
        </div>
      </div>

      <!-- Panel derecho: Formulario rápido -->
      <div class="pos-right">
        <h2 class="section-title">Registrar Corte</h2>
        ${barberoSel ? `
        <div class="pos-form">
          <div class="barbero-selected-tag">
            <span class="dot-green"></span>
            Registrando como: <strong>${state.barberos.find(b=>b.id===barberoSel)?.nombre}</strong>
          </div>

          <div class="form-group">
            <label>SERVICIO</label>
            <div class="service-pills">
              ${state.servicios.map(s => `
                <button class="service-pill" data-action="sel-servicio" data-id="${s.id}" data-precio="${s.precio}" data-nombre="${s.nombre}">
                  <span class="pill-name">${s.nombre}</span>
                  <span class="pill-price">${fmtCOP(s.precio)}</span>
                </button>
              `).join('')}
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>MONTO COBRADO (COP)</label>
              <input id="inp-precio" type="number" class="inp" placeholder="0" />
            </div>
            <div class="form-group">
              <label>MÉTODO DE PAGO</label>
              <select id="inp-pago" class="inp">
                <option>Efectivo</option>
                <option>Nequi</option>
                <option>Daviplata</option>
                <option>Bancolombia</option>
                <option>Tarjeta</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>CLIENTE (opcional)</label>
              <input id="inp-cliente" type="text" class="inp" placeholder="Nombre del cliente" />
            </div>
            <div class="form-group">
              <label>SERVICIO DESCRIPCIÓN</label>
              <input id="inp-servicio-txt" type="text" class="inp" placeholder="Corte Clásico..." />
            </div>
          </div>

          <button class="btn-primary btn-full" data-action="registrar-corte">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            REGISTRAR CORTE
          </button>
        </div>

        <!-- Últimos cortes del barbero -->
        <div class="recent-section">
          <h3 class="sub-title">Mis cortes de hoy</h3>
          <div class="recent-list">
            ${state.cortes.filter(c => c.barbeId === barberoSel && new Date(c.ts) >= todayStart()).slice(0,5).map(c => `
              <div class="recent-item">
                <div class="recent-info">
                  <span class="recent-servicio">${c.servicio}</span>
                  <span class="recent-hora">${fmtHora(c.ts)}</span>
                </div>
                <span class="recent-precio">${fmtCOP(c.precio)}</span>
                <span class="recent-pago pago-${c.pago?.toLowerCase()}">${c.pago}</span>
              </div>
            `).join('') || '<p class="empty-msg">Sin cortes aún hoy</p>'}
          </div>
        </div>
        ` : `
        <div class="no-barber-msg">
          <div class="no-barber-icon">✂️</div>
          <p>Selecciona tu perfil para comenzar a registrar</p>
        </div>
        `}
      </div>
    </div>

    <!-- Resumen de todos los barberos hoy -->
    <div class="today-summary">
      <h2 class="section-title">Resumen del Día — Todos los Barberos</h2>
      <div class="barber-summary-grid">
        ${state.barberos.map(b => {
          const cortesB = state.cortes.filter(c => c.barbeId === b.id && new Date(c.ts) >= todayStart());
          const totalB = cortesB.reduce((s,c) => s + Number(c.precio), 0);
          return `
          <div class="barber-summary-card">
            <div class="bs-header">
              <div class="bs-avatar">${b.nombre.split(' ').map(x=>x[0]).join('')}</div>
              <div>
                <div class="bs-name">${b.nombre}</div>
                <div class="bs-esp">${b.especialidad}</div>
              </div>
            </div>
            <div class="bs-stats">
              <div class="bs-stat">
                <span class="bs-num">${cortesB.length}</span>
                <span class="bs-lbl">cortes</span>
              </div>
              <div class="bs-stat">
                <span class="bs-num gold">${fmtCOP(totalB)}</span>
                <span class="bs-lbl">ingresos</span>
              </div>
            </div>
            <div class="bs-cortes">
              ${cortesB.slice(0,3).map(c => `<div class="bs-corte-item"><span>${c.servicio}</span><span>${fmtHora(c.ts)}</span><span>${fmtCOP(c.precio)}</span></div>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>
    `;
  }

  // ==================== VENTAS ====================
  function renderVentas() {
    const hoy = state.cortes.filter(c => new Date(c.ts) >= todayStart());
    const ingHoy = hoy.reduce((s,c) => s + Number(c.precio), 0);
    const ingTotal = state.cortes.reduce((s,c) => s + Number(c.precio), 0);

    // Por método de pago
    const porPago = {};
    state.cortes.forEach(c => { porPago[c.pago] = (porPago[c.pago]||0) + Number(c.precio); });

    return `
    <div class="ventas-layout">
      <h2 class="section-title">Historial de Ventas</h2>

      <div class="ventas-filters">
        <button class="filter-btn active" data-action="filter-ventas" data-range="hoy">Hoy</button>
        <button class="filter-btn" data-action="filter-ventas" data-range="semana">Esta semana</button>
        <button class="filter-btn" data-action="filter-ventas" data-range="mes">Este mes</button>
        <button class="filter-btn" data-action="filter-ventas" data-range="todo">Todo</button>
      </div>

      <!-- Resumen por método de pago -->
      <div class="pago-summary">
        ${Object.entries(porPago).map(([pago, total]) => `
          <div class="pago-card pago-bg-${pago.toLowerCase()}">
            <span class="pago-method">${pago}</span>
            <span class="pago-total">${fmtCOP(total)}</span>
          </div>
        `).join('')}
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>HORA</th><th>BARBERO</th><th>SERVICIO</th><th>CLIENTE</th><th>MONTO</th><th>PAGO</th></tr>
          </thead>
          <tbody>
            ${state.cortes.length === 0 ? `<tr><td colspan="6" class="empty-td">Sin ingresos registrados</td></tr>` :
              state.cortes.map(c => {
                const b = state.barberos.find(x => x.id === c.barbeId);
                return `<tr>
                  <td><span class="hora-badge">${fmtHora(c.ts)}</span> <span class="fecha-dim">${fmtFecha(c.ts)}</span></td>
                  <td>${b?.nombre || '—'}</td>
                  <td>${c.servicio}</td>
                  <td>${c.clienteNombre || '—'}</td>
                  <td class="gold">${fmtCOP(c.precio)}</td>
                  <td><span class="pago-badge pago-${c.pago?.toLowerCase()}">${c.pago}</span></td>
                </tr>`;
              }).join('')
            }
          </tbody>
        </table>
      </div>
    </div>
    `;
  }

  // ==================== CLIENTES ====================
  function renderClientes() {
    return `
    <div>
      <h2 class="section-title">Gestión de Clientes</h2>
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr><th>NOMBRE</th><th>VISITAS</th><th>ÚLTIMO SERVICIO</th><th>BARBERO FAV.</th><th>ÚLTIMA VISITA</th></tr>
          </thead>
          <tbody>
            ${state.clientes.length === 0 ? `<tr><td colspan="5" class="empty-td">Sin clientes registrados</td></tr>` :
              state.clientes.sort((a,b) => b.visitas - a.visitas).map(c => {
                const bFav = state.barberos.find(x => x.id === c.barberoFav);
                return `<tr>
                  <td><strong>${c.nombre}</strong></td>
                  <td><span class="visitas-badge">${c.visitas}</span></td>
                  <td>${c.ultimoServicio}</td>
                  <td>${bFav?.nombre || '—'}</td>
                  <td class="fecha-dim">${fmtFecha(c.ts)}</td>
                </tr>`;
              }).join('')
            }
          </tbody>
        </table>
      </div>
    </div>
    `;
  }

  // ==================== SERVICIOS ====================
  function renderServicios() {
    return `
    <div>
      <h2 class="section-title">Editar Servicios y Precios</h2>
      <div class="servicios-list">
        ${state.servicios.map(s => `
          <div class="servicio-row" data-id="${s.id}">
            <input class="inp inp-sm serv-nombre" type="text" value="${s.nombre}" />

  function renderGaleria() {
    return `
    <div>
      <h2 class="section-title">Editar GalerÃ­a</h2>
      <div class="gallery-admin-grid">
        ${galleryData.map((src, index) => `
          <div class="gallery-admin-item" data-index="${index}">
            <div class="gallery-admin-preview">${hasImage(src) ? `<img src="${src}" alt="GalerÃ­a ${index + 1}">` : `<span>${index + 1}</span>`}</div>

  // ==================== EVENT HANDLERS ====================
  function attachHandlers() {
    document.querySelectorAll('[data-action]').forEach(el => {
      el.addEventListener('click', handleAction);
    });
    document.querySelectorAll('.barb-foto').forEach(input => {
      input.addEventListener('change', (event) => {
        const row = event.currentTarget.closest('.barbero-row');
        const b = state.barberos.find(x => x.id === row?.dataset.id);
        const file = event.currentTarget.files?.[0];
        if(!b || !file) return;
        readImageFile(file, (src) => {
          b.foto = src;
          persistBarbers();
          renderContent();
          showToast('Foto de barbero guardada');
        });
      });
    });
    document.querySelectorAll('.gallery-file').forEach(input => {
      input.addEventListener('change', (event) => {
        const row = event.currentTarget.closest('.gallery-admin-item');
        const file = event.currentTarget.files?.[0];
        if(!row || !file) return;
        readImageFile(file, (src) => {
          galleryData[Number(row.dataset.index)] = src;
          persistGallery();
          renderContent();
          showToast('Imagen de galeria guardada');
        });
      });
    });
  }

  let selectedServiceId = null;

  function handleAction(e) {
    const action = e.currentTarget.dataset.action;
    const id = e.currentTarget.dataset.id;

    if(action === 'sel-barbero') {
      state.barberoActivo = state.barberoActivo === id ? null : id;
      selectedServiceId = null;
      renderContent();
    }
    else if(action === 'sel-servicio') {
      document.querySelectorAll('.service-pill').forEach(p => p.classList.remove('selected'));
      e.currentTarget.classList.add('selected');
      selectedServiceId = id;
      const precio = e.currentTarget.dataset.precio;
      const nombre = e.currentTarget.dataset.nombre;
      document.getElementById('inp-precio').value = precio;
      document.getElementById('inp-servicio-txt').value = nombre;
    }
    else if(action === 'registrar-corte') {
      registrarCorte();
    }
    else if(action === 'save-servicio') {
      const row = document.querySelector(`.servicio-row[data-id="${id}"]`);
      const s = state.servicios.find(x => x.id === id);
      if(s && row) {
        s.nombre = row.querySelector('.serv-nombre').value;
        s.precio = Number(row.querySelector('.serv-precio').value);
        s.duracion = parseInt(row.querySelector('.serv-duracion').value) || 30;
        persistServices();
        showToast('Servicio guardado ✓');
        renderContent();
      }
    }
    else if(action === 'del-servicio') {
      state.servicios = state.servicios.filter(x => x.id !== id);
      persistServices();
      renderContent();
    }
    else if(action === 'add-servicio') {
      const nombre = document.getElementById('new-serv-nombre').value.trim();
      const precio = Number(document.getElementById('new-serv-precio').value);
      const duracion = parseInt(document.getElementById('new-serv-duracion').value) || 30;
      if(nombre && precio) {
        state.servicios.push({ id: String(Date.now()), nombre, precio, duracion });
        persistServices();
        renderContent();
        showToast('Servicio agregado ✓');
      }
    }
    else if(action === 'save-barbero') {
      const row = document.querySelector(`.barbero-row[data-id="${id}"]`);
      const b = state.barberos.find(x => x.id === id);
      if(b && row) {
        b.nombre = row.querySelector('.barb-nombre').value;
        b.especialidad = row.querySelector('.barb-esp').value;
        b.tel = row.querySelector('.barb-tel').value;
        persistBarbers();
        showToast('Barbero guardado ✓');
        renderContent();
      }
    }
    else if(action === 'del-barbero') {
      if(confirm('¿Eliminar este barbero?')) {
        state.barberos = state.barberos.filter(x => x.id !== id);
        if(state.barberoActivo === id) state.barberoActivo = null;
        persistBarbers();
        renderContent();
      }
    }
    else if(action === 'add-barbero') {
      const nombre = document.getElementById('new-barb-nombre').value.trim();
      const esp = document.getElementById('new-barb-esp').value.trim();
      const tel = document.getElementById('new-barb-tel').value.trim();
      if(nombre) {
        state.barberos.push({ id: String(Date.now()), nombre, especialidad: esp, tel, foto: null, activo: true });
        persistBarbers();
        renderContent();
        showToast('Barbero agregado ✓');
      }
    }
    else if(action === 'save-gallery') {
      const row = document.querySelector(`.gallery-admin-item[data-index="${id}"]`);
      galleryData[Number(id)] = row.querySelector('.gallery-url').value.trim();
      persistGallery();
      renderContent();
      showToast('Imagen de galeria guardada');
    }
    else if(action === 'clear-gallery') {
      galleryData[Number(id)] = '';
      persistGallery();
      renderContent();
      showToast('Imagen quitada');
    }
    else if(action === 'nav') {
      state.activeTab = id;
      document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
      e.currentTarget.classList.add('active');
      renderContent();
    }
  }

  async function registrarCorte() {
    const precio = Number(document.getElementById('inp-precio')?.value);
    const pago = document.getElementById('inp-pago')?.value;
    const clienteNombre = document.getElementById('inp-cliente')?.value?.trim();
    const servicio = document.getElementById('inp-servicio-txt')?.value?.trim() || 'Servicio';

    if(!precio || !state.barberoActivo) {
      showToast('Selecciona barbero y monto ⚠️', 'warn');
      return;
    }

    const corte = {
      id: getId(),
      barbeId: state.barberoActivo,
      servicio,
      precio,
      pago,
      clienteNombre,
      ts: new Date().toISOString(),
    };

    await saveCorte(corte);
    showToast(`Corte registrado — ${fmtCOP(precio)} ✓`);
    // limpiar campos
    document.getElementById('inp-precio').value = '';
    document.getElementById('inp-cliente').value = '';
    document.getElementById('inp-servicio-txt').value = '';
    selectedServiceId = null;
    document.querySelectorAll('.service-pill').forEach(p => p.classList.remove('selected'));
  }

  function showToast(msg, type='ok') {
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.classList.add('show'), 10);
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 400); }, 2800);
  }

  function doAdminLogin() {
    const user = document.getElementById('login-user').value.trim();
    const pass = document.getElementById('login-pass').value;
    if(user === 'admin' && pass === 'krom2024') {
      sessionStorage.setItem('krom_admin_auth', '1');
      document.body.classList.remove('admin-locked');
      syncStateFromStorage();
      renderAll();
      return;
    }
    document.getElementById('login-error').textContent = 'Usuario o contraseÃ±a incorrectos.';
  }

  // ==================== INIT ====================
  window.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.nav-link').forEach(l => {
      l.addEventListener('click', (e) => {
        state.activeTab = l.dataset.id;
        document.querySelectorAll('.nav-link').forEach(x => x.classList.remove('active'));
        l.classList.add('active');
        renderContent();
      });
    });
    document.getElementById('login-pass')?.addEventListener('keydown', (event) => {
      if(event.key === 'Enter') doAdminLogin();
    });
    if(sessionStorage.getItem('krom_admin_auth') === '1') {
      document.body.classList.remove('admin-locked');
      loadFromFirebase();
      renderAll();
    }
  });
</script>
